version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: db_interview_tray
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_interview_tray
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  app:
    build: .
    container_name: api_interview_tray
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - mailhog
    networks:
      - app-network
    environment:
      DB_HOST: db
      DB_CONNECTION: mysql
    mem_limit: 512m
    cpus: "0.5"      

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local
