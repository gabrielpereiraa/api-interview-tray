version: '3.8'

services:
  db:
    image: mysql:latest
    container_name: db_interview_tray
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_interview_tray
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  app:
    build: .
    container_name: api_interview_tray
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: db_interview_tray
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: db_interview_tray_test
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: root
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
    driver: local